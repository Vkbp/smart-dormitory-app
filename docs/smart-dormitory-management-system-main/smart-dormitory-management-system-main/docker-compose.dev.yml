services:
  postgres:
    image: postgres:16-alpine
    container_name: sdms-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdms_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "5433:5432"
    volumes:
      - sdms-postgres-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sdms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sdms-redis-dev
    ports:
      - "6380:6379"

  backend:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: sdms-backend-dev
    working_dir: /workspace
    command: mvn spring-boot:run
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./sdms-backend:/workspace
      - sdms-maven-cache:/root/.m2
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sdms_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SERVER_PORT: 8080
      SDMS_MQTT_URL: tcp://mosquitto:1883

  frontend:
    image: node:20-alpine
    container_name: sdms-frontend-dev
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./sdms-frontend:/workspace
      - sdms-frontend-node-modules:/workspace/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"

  mosquitto:
    image: eclipse-mosquitto:2.0.15
    container_name: sdms-mosquitto-dev
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - sdms-mosquitto-data:/mosquitto/data
      - sdms-mosquitto-log:/mosquitto/log

volumes:
  sdms-postgres-data-dev:
  sdms-maven-cache:
  sdms-frontend-node-modules:
  sdms-mosquitto-data:
  sdms-mosquitto-log:
